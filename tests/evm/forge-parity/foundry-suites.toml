checkout_root = "tests/.foundry-suites"

[lean_runner]
status = "stateful-replay-alpha"
supported_cheatcodes = [
  "addr",
  "assume",
  "chainId",
  "coinbase",
  "cool",
  "coolSlot",
  "deal",
  "etch",
  "expectCall",
  "expectEmit",
  "expectRevert",
  "fee",
  "getNonce",
  "getRecordedLogs",
  "label",
  "load",
  "prank",
  "prevrandao",
  "recordLogs",
  "revertToState",
  "rewind",
  "roll",
  "setNonce",
  "sign",
  "skip",
  "snapshotState",
  "startPrank",
  "stopPrank",
  "store",
  "txGasPrice",
  "warmSlot",
  "warp",
]
forge_side_only_cheatcodes = [
  "coolSlot",
  "deal",
  "etch",
  "ffi",
  "getNonce",
  "getRecordedLogs",
  "lastCallGas",
  "load",
  "recordLogs",
  "store",
]
notes = "The local parity cases use forge-side cheatcodes to compare one case with Lean. The replay runner now has an alpha Lean-side cheatcode tier for state, prank, logs, snapshots, and block/env mutation; expectation-only helpers such as expectEmit/expectCall are currently permissive no-ops and still need assertion semantics."

[[suite]]
id = "local-forge-parity"
name = "Local Forge/Lean parity cases"
kind = "local"
path = "tests/evm/forge-parity"
enabled = true
lean_replay = "ffi-self-check"
forge_args = [
  "--ffi",
  "--evm-version",
  "osaka",
  "--enable-tx-gas-limit",
  "--gas-limit",
  "16777216",
]
notes = "Current executable parity suite. It should stay green while the upstream runner grows."

[[suite]]
id = "uniswap-v4-core"
name = "Uniswap v4 core"
kind = "git"
repo = "https://github.com/Uniswap/v4-core.git"
rev = "46c6834698c48bc4a463a86d8420f4eb1d7f3b75"
enabled = false
lean_replay = "planned"
submodules = true
forge_args = []
notes = "Primary large Foundry target: hooks, pools, transient storage, many deployments, and heavy cheatcode use."

