name: refinement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refinement-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refinement:
    name: Refinement
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl -fsSL -o elan-init.sh \
            https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache solar, solc and Z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: refinement-tools-${{ hashFiles('scripts/refinement/solar-rev', 'scripts/refinement/gen.sh', 'scripts/refinement/prove-rev', 'scripts/refinement/facts.sh') }}

      - name: Cache Lake build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: refinement-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: refinement-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # SolarTV and solar's generated stages and proofs live in this repository (tv/, Certified/),
      # so the milestones build here with no solar checkout. solar's certify job regenerates
      # Certified/<name> against a pinned commit of this repository and fails on any difference.
      - name: Build the certified libraries
        env:
          # The runner has 16 GB: each Lean process is capped.
          LEAN_NUM_THREADS: "2"
        run: |
          lake exe cache get || true
          lake build -KleanMemory=4500 EvmRules SolarTV W1Proofs W1 counter w4 masks bank c4 mulx             events reader Loom Verify VerifySpec VerifySpecTrustedBase VerifyLoom VerifyDischarge             VerifyVC ContractsVC ContractsCounter ContractsArrayMaxVault SolidCore SolidCoreSolarW4             SolidCoreSolarC4 SolidCoreSolarMulX SolidCoreSolarBank SolidCoreSolarBankSource             ContractsC4Spec SolidCore.Refinement.Axioms.Audit

      # Every headline's #print axioms, the sweep over their modules and the closure grep for
      # sorry, native_decide, bv_decide and ofReduceBool.
      - name: Audit the headlines' axioms
        env:
          AXIOM_MEMORY: "6000"
        run: scripts/refinement/axiom-audit.sh

      - name: Check the refinement proofs and analysis facts
        env:
          # Each Z3 process may use up to 8 GB; the runner has 16 GB.
          FACTS_JOBS: 1
        run: scripts/refinement/check.sh
