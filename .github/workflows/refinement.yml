name: refinement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refinement-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refinement:
    name: Refinement
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl -fsSL -o elan-init.sh \
            https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache solar, solc and Z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: refinement-tools-${{ hashFiles('scripts/refinement/solar-rev', 'scripts/verify/uniswap_v2_spec-solar-rev', 'scripts/verify/uniswap_v2_stages-solar-rev', 'scripts/refinement/gen.sh', 'scripts/refinement/prove-rev', 'scripts/refinement/facts.sh') }}

      # Restored here and saved after the builds even when one fails or the runner stops, so a
      # later run resumes where this one got to (the native objects of Mathlib and EthLib, which
      # EthLib's precompiled modules need, take most of a cold build).
      - name: Restore the Lake build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: refinement-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: refinement-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # SolarTV and solar's generated stages and proofs live in this repository (tv/, Certified/),
      # so the milestones build here with no solar checkout. solar's certify job regenerates
      # Certified/<name> against a pinned commit of this repository and fails on any difference.
      # In stages, two jobs at a time and each Lean process capped, so that the 16 GB runner does
      # not run out of memory.
      - name: Build SolarTV and the dependencies
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          lake exe cache get || true
          lake build -KleanMemory=3000 EvmRules SolarTV W1Proofs

      - name: Build the Certified contracts
        env:
          LEAN_NUM_THREADS: "2"
        run: lake build -KleanMemory=3000 W1 counter w4 masks bank c4 mulx events reader verify_token verify_counter callsqrt arraymax

      - name: Build the verification libraries and Contracts
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          lake build -KleanMemory=6000 Loom Verify VerifySpec VerifySpecTrustedBase VerifyLoom VerifyDischarge VerifyVC ContractsVC ContractsCounter ContractsArrayMaxVault ContractsVerifyCounter ContractsCallSqrt ContractsToken ContractsCallFamilies ContractsShapes ContractsCallSqrt

      # The Uniswap V2 port's sources and checked cores are generated from the pinned port, not
      # committed (v2-core is GPL-3.0), so they are generated here before their build.
      - name: Generate and check the Uniswap V2 port
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          scripts/verify/uniswap_v2_gen.sh
          lake build -KleanMemory=6000 ContractsUniswapV2
          # UniswapV2Pair's source acceptance in 22 generated stage modules; the largest (swap's
          # lowering) peaks at 5.98 GB under -M 6000, so this step has little memory margin.
          lake build -KleanMemory=6000 ContractsUniswapV2Pair

      # The ERC20 specs' connection needs solar-verify and solar's spec tooling
      # (crates/verify/uniswap-v2, tools/certify/spec_connect.py) at the commit pinned in
      # scripts/verify/uniswap_v2_spec-solar-rev. Its modules are generated, not committed, so
      # they are generated here and then checked.
      - name: Connect and check the Uniswap V2 ERC20 specs
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          rev="$(tr -d '[:space:]' < scripts/verify/uniswap_v2_spec-solar-rev)"
          dir=.cache/solar-spec
          if [[ ! -x "$dir/target/release/solar-verify" || "$(git -C "$dir" rev-parse HEAD 2>/dev/null)" != "$rev" ]]; then
            rm -rf "$dir"; git init -q "$dir"
            git -C "$dir" remote add origin https://github.com/paradigmxyz/solar.git
            git -C "$dir" fetch -q --depth 1 origin "$rev"
            git -C "$dir" checkout -q --detach "$rev"
            cargo build --release --locked --manifest-path "$dir/Cargo.toml" --bin solar-verify
          fi
          SOLAR_DIR="$dir" SOLAR_VERIFY="$dir/target/release/solar-verify" scripts/verify/uniswap_v2_spec.sh
          lake build -KleanMemory=6000 ContractsUniswapV2ERC20Spec

      # UniswapV2ERC20.transfer's slice (docs/CERTIFICATION_TARGET.md): the source stage (E3), the
      # backend stages for transfer's calls (E4), the bytes and gas certificates (E5, E8). The stages
      # and certificates are compiled from the port by solar at the commit pinned in
      # scripts/verify/uniswap_v2_stages-solar-rev, with its tools/certify, and checked here; they are
      # not committed (the port is GPL-3.0). Every module is checked within 6 GB.
      - name: Generate and check UniswapV2ERC20.transfer's slice
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          scripts/verify/uniswap_v2_stages.sh
          lake build -KleanMemory=6000 uv2_erc20 ContractsUniswapV2ERC20SourceMir

      - name: Build SolidCore's refinement milestones
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          lake build -KleanMemory=7000 SolidCore SolidCoreSolarW4 SolidCoreSolarC4 SolidCoreSolarMulX SolidCoreSolarBank SolidCoreSolarBankSource SolidCoreSolarTotality SolidCoreSolarAssemblyEnv SolidCoreSolarRunOracle SolidCoreSolarRevert SolidCoreSolarCreate ContractsC4Spec SolidCore.Refinement.Axioms.Audit SolidCore.Refinement.Axioms.Main SolidCore.Refinement.Axioms.C4 SolidCore.Refinement.Axioms.MulX SolidCore.Refinement.Axioms.W4 SolidCore.Refinement.Axioms.CounterGeneric SolidCore.Refinement.Axioms.Contracts SolidCore.Refinement.Axioms.Token SolidCore.Refinement.Axioms.VerifyCounter SolidCore.Refinement.Axioms.Lanes

      - name: Save the Lake build
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: refinement-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      # Every headline's #print axioms, the sweep over their modules and the closure grep for
      # sorry, native_decide, bv_decide and ofReduceBool.
      - name: Audit the headlines' axioms
        env:
          AXIOM_MEMORY: "6000"
        run: scripts/refinement/axiom-audit.sh

      - name: Check the refinement proofs and analysis facts
        env:
          # Each Z3 process may use up to 8 GB; the runner has 16 GB.
          FACTS_JOBS: 1
        run: scripts/refinement/check.sh
