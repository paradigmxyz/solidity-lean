name: loopvc

# Generated loop obligations (Verify/Infer/loopvc): regenerates the pinned exports from the
# exported loop edges, discharges them with Verify/Discharge/discharge.sh and checks that a wrong
# invariant is rejected with a counterexample.

on:
  push:
    branches: [main, "alpharush/loopvc-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopvc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  loopvc:
    name: Loop obligations
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl -fsSL -o elan-init.sh \
            https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install z3
        run: |
          curl -fsSL -o z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-4.13.4/z3-4.13.4-x64-glibc-2.35.zip
          echo "93f91f9c6f4a00a041c19fc7a74adc1f441c8244ce70d486e19abcd89c6a014b  z3.zip" | sha256sum -c -
          unzip -q z3.zip
          mkdir -p "$HOME/.local/bin"
          cp z3-4.13.4-x64-glibc-2.35/bin/z3 "$HOME/.local/bin/"
          rm -rf z3.zip z3-4.13.4-x64-glibc-2.35
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore the discharge library build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Verify/Discharge/Reconstruct/.lake
          key: loopvc-reconstruct-${{ hashFiles('Verify/Discharge/Reconstruct/lean-toolchain', 'Verify/Discharge/Reconstruct/lake-manifest.json', 'Verify/Discharge/Reconstruct/lakefile.lean', 'Verify/Obligation/**', 'Verify/Discharge/**/*.lean') }}
          restore-keys: loopvc-reconstruct-

      - name: Build the discharge library
        env:
          LEAN_NUM_THREADS: "2"
        run: cd Verify/Discharge/Reconstruct && lake build -KleanMemory=3000

      - name: Check the generated loop obligations
        env:
          LEAN_NUM_THREADS: "1"
        run: bash Verify/Infer/loopvc/check.sh "$RUNNER_TEMP/loopvc"
