# The certification plan as a dependency graph (docs/blueprint/README.md).
# One node per obligation (contract function x edge E2..E8 of docs/CERTIFICATION_TARGET.md) plus the
# shared premises, specs, statements and lemmas they rest on. scripts/blueprint/check.py reads it,
# audits every decl in Lean and writes status.json and status.md. A decl here is evidence only once
# the checker reports it proved; a hand-written functional model is a lemma, never an edge.

[[node]]
id = "trust.E0.port"
kind = "trusted"
edge = "E0"
statement = "Upstream v2-core 0.5.16 -> the pinned 0.8 port by port.py's text edits: a stated trust boundary, not an equivalence proof"
deps = []
lane = "integrator"
owner = "2ee861d1-b973-4036-b30a-2183629488c0"
branch = ""
acceptance = "stated in docs/CERTIFICATION_TARGET.md and signed off by a reviewer; never proved"
priority = "P2"
human_review = true

[[node]]
id = "trust.E1.frontend"
kind = "trusted"
edge = "E1"
statement = "port .sol -> solc AST -> Source.lean (uniswap_v2_sources.py, solc_ast_to_lean_source.py): trusted frontend; regenerating or hashing Source.lean does not prove it denotes the source"
deps = ["trust.E0.port"]
lane = "integrator"
owner = "2ee861d1-b973-4036-b30a-2183629488c0"
branch = ""
acceptance = "stated in docs/CERTIFICATION_TARGET.md and signed off by a reviewer; never proved"
priority = "P2"
human_review = true

[[node]]
